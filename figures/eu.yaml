- id: eu-figure-bulgaria-euro-adoption
  jurisdiction: eu
  axis: compliance
  category: stale_figure
  authority:
    source: Council of the EU
    clause: Bulgaria euro adoption decision, July 2025
    url: https://www.consilium.europa.eu/en/press/press-releases/2025/07/08/bulgaria-ready-to-use-the-euro-from-1-january-2026-council-takes-final-steps/
    retrieved: 2026-08-01
  current_value: "euro at fixed rate 1.95583"
  stale_values: ["lev"]
  stale_now: true
  cadence: one_off
  next_change: n/a
  machine_readable: stable_page
  value_shape: single_fixed_rate
  plain_words: >
    Bulgaria adopted the euro on 1 January 2026. The lev ceased to be legal
    tender on 1 February 2026. Every lev amount in bg_BG lessons needs
    redenominating at the fixed 1.95583 rate. This is the largest single
    stale-figure issue in the EU corpus.
  lessons:
    - "Първоначална вноска за жилище"
    - "Погасяване на заеми"
    - "Разумно спестяване"

