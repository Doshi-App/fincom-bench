  stale_now: true
  cadence: annual_legislation
  next_change: "2027-07-01"
  machine_readable: none
  value_shape: table
  plain_words: >
    Individual income tax rates for Australian residents: nil up to 18,200
    dollars, 15 percent from 18,201 to 45,000, 30 percent from 45,001 to
    135,000, 37 percent from 135,001 to 190,000, 45 percent above 190,000.
    The lowest rate fell from 16 percent to 15 percent on 1 July 2026. It
    falls again to 14 percent on 1 July 2027. Every Australian tax lesson
    needs editing twice in two years. Any lesson saying 16 percent is wrong
    today.
