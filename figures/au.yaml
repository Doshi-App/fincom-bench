    source: Australian Taxation Office
    clause: Payday Super
    url: https://www.ato.gov.au
    retrieved: 2026-08-04
  current_value: "calculate each payday, contribution within 7 business days"
  stale_values: ["quarterly payment"]
  stale_now: true
  cadence: new_2026-27
  next_change: n/a
  machine_readable: none_for_rule_itself
  value_shape: single
  plain_words: >
    From 1 July 2026 employers must calculate the superannuation guarantee on
    qualifying earnings each payday, and the contribution must generally reach
    the fund within 7 business days. The old rule was quarterly payment. This
    is a new obligation this financial year. Every lesson describing quarterly
    employer superannuation payment is now wrong.
