- id: au-figure-division-296-tax
  jurisdiction: au
  axis: compliance
  category: stale_figure
  authority:
    source: Australian Taxation Office
    clause: Division 296 tax
    url: https://www.ato.gov.au
    retrieved: 2026-08-04
  current_value: "extra 15% above 3m, further 10% above 10m"
  stale_values: []
  stale_now: false
  cadence: new_2026-27
  next_change: n/a
  machine_readable: none
  value_shape: single
  plain_words: >
    Division 296 tax starts 1 July 2026 and first applies to earnings in the
    2026-27 year. An extra 15 percent on the share of earnings attributable
    to a total superannuation balance above 3 million dollars, and a further
    10 percent on the share attributable to a balance above 10 million
    dollars. The first assessment uses the balance at 30 June 2027. Brand new
    this financial year. Any lesson written before 1 July 2026 that describes
    superannuation tax without this will be incomplete.
  lessons: []

