# Australia expiring statutory figures for FinCom Bench
# Seeded from OPS-1512: Australia as the fourth rule book.
# Values are for the 2026-27 financial year, which began on 1 July 2026.
# For Australian statutory figures the numbers are not published in
# machine-readable form. See the plain_words field on each record.

- id: au-figure-super-guarantee-rate
  jurisdiction: au
  axis: compliance
  category: stale_figure
  authority:
    source: Superannuation Guarantee (Administration) Act 1992
    clause: s. 19(2) table
    url: https://www.legislation.gov.au/C2004A02092/latest/text
    retrieved: 2026-08-04
  current_value: "12%"
  stale_values: ["9.5%", "10%", "10.5%", "11%", "11.5%"]
  stale_now: true
  cadence: legislated_step_up_finished
  next_change: only_by_amending_act
  machine_readable: federal_register_api
  value_shape: single
  plain_words: >
    The superannuation guarantee rate is 12 percent of qualifying earnings.
    The rate reached 12 percent on 1 July 2025 and stays at 12 percent.
    No further increase is scheduled. This is the known stale figure in live
    lessons. The most likely stale value is 11.5 percent, which was correct
    for 2024-25. The ATO publishes no machine-readable rate feed. The Act
    text is machine-readable through the Federal Register of Legislation API
    at https://api.prod.legislation.gov.au/v1/.
  lessons:
    - "Understanding Superannuation for Essential Workers"
    - "Retirement and Superannuation Plans"
    - "Employer Retirement Plans Explained (Superannuation)"

- id: au-figure-payday-super
  jurisdiction: au
  axis: compliance
