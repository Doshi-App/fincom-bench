- id: eu-conduct-fair-clear-not-misleading
  jurisdiction: eu
  axis: compliance
  category: missing_caveat
  authority:
    source: Delegated Reg. 2017/565
    clause: art. 44
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32017R0565
    retrieved: 2026-08-01
  binds:
  - institution
  plain_words: 'Information must be accurate, must not emphasise benefits without
    a prominent indication of risks, must not disguise or diminish warnings, and past
    and future performance must carry prescribed warnings and periods.

    '
  tests:
    lesson:
      id: eu-conduct-fair-clear-not-misleading-lesson
    chat:
      id: eu-conduct-fair-clear-not-misleading-chat
- id: eu-conduct-marketing-identifiable
  jurisdiction: eu
  axis: compliance
  category: missing_caveat
  authority:
    source: MiFID II
    clause: art. 24(1) and 24(3)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32014L0065
    retrieved: 2026-08-01
  binds:
  - institution
  plain_words: 'All information, including marketing communications, shall be fair,
