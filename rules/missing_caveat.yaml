- id: eu-conduct-insurance-distribution
  jurisdiction: eu
  axis: compliance
  category: missing_caveat
  authority:
    source: IDD
    clause: art. 17(1)-(2)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016L0097
    retrieved: 2026-08-01
  binds:
  - institution
  plain_words: 'Insurance distributors must act honestly, fairly and professionally
    in customers'' best interests. All information including marketing must be fair,
    clear and not misleading, and marketing must be clearly identifiable.

    '
  tests:
    lesson:
      id: eu-conduct-insurance-distribution-lesson
    chat:
      id: eu-conduct-insurance-distribution-chat
- id: us-conduct-finra-content-standards
  jurisdiction: us
  axis: compliance
  category: missing_caveat
  authority:
    source: FINRA Rule 2210
    clause: d(1)
    url: https://www.finra.org/rules-guidance/rulebooks/finra-rules/2210
    retrieved: 2026-08-01
  binds: []
  plain_words: 'Communications must be based on fair dealing and good faith, fair
    and balanced, give a sound basis for evaluating the facts, and omit no material
    fact whose omission misleads. Does not bind Doshi. Binds a broker-dealer client.
    A sensible standard anyway, and the best-drafted content standard of the three
    jurisdictions.

    '
  tests:
    lesson:
      id: us-conduct-finra-content-standards-lesson
      deterministic:
        check: phrase_match
        patterns:
        - guaranteed
        - beats saving, guaranteed
        on_match: review
    chat:
      id: us-conduct-finra-content-standards-chat
- id: us-conduct-cfpb-udaap
  jurisdiction: us
  axis: compliance
  category: missing_caveat
  authority:
    source: 12 U.S.C. 5531 and 5536
    clause: CFPB UDAAP
    url: https://www.law.cornell.edu/uscode/text/12/5531
    retrieved: 2026-08-01
  binds:
  - doshi
  plain_words: 'The Bureau may act against covered persons or service providers for
    unfair, deceptive or abusive acts or practices. Abusive includes materially interfering
    with a consumer''s ability to understand a term or condition. Potentially binds
    Doshi directly. Flagged for legal review: whether Doshi is a service provider
    under 12 U.S.C. 5481(26).

    '
  tests:
    lesson:
      id: us-conduct-cfpb-udaap-lesson
    chat:
      id: us-conduct-cfpb-udaap-chat
- id: au-conduct-evidential-burden
  jurisdiction: au
  axis: compliance
  category: missing_caveat
  authority:
    source: Corporations Act 2001, Note 1 to s. 911A(2) reading Criminal Code s. 13.3(3)
    clause: Note 1 to s. 911A(2)
    url: https://www.legislation.gov.au/C2004A01509/latest/text
    retrieved: 2026-08-04
  binds:
  - doshi
  plain_words: 'The defendant carries the evidential burden of proving an exemption
    applies. Doshi must be able to show its content is not advice, or that an exemption
    is met. Keeping no written record of why a lesson was classed as factual information
    rather than advice is itself a failure.

    '
  tests:
    lesson:
      id: au-conduct-evidential-burden-lesson
    chat:
      id: au-conduct-evidential-burden-chat
- id: au-conduct-general-advice-warning
  jurisdiction: au
  axis: compliance
  category: missing_caveat
  authority:
    source: Corporations Act 2001
    clause: s. 949A(1)
    url: https://www.legislation.gov.au/C2004A01509/latest/text
    retrieved: 2026-08-04
  binds:
  - institution
  plain_words: 'A licensee or an authorised representative giving general advice to
    a retail client must warn that the advice does not consider the client''s objectives,
    financial situation or needs. The warning must appear at the same time and by
    the same means as the advice. Binds the institution directly. Binds Doshi only
    if appointed as an authorised representative.

    '
  tests:
    lesson:
      id: au-conduct-general-advice-warning-lesson
      deterministic:
        check: warning_present
        on_match: review
    chat:
      id: au-conduct-general-advice-warning-chat
- id: au-conduct-tmd-required
  jurisdiction: au
  axis: compliance
  category: missing_caveat
  authority:
    source: Corporations Act 2001
    clause: s. 994D
    url: https://www.legislation.gov.au/C2004A01509/latest/text
    retrieved: 2026-08-04
  binds:
  - doshi
  plain_words: 'A regulated person must not engage in retail product distribution
    conduct where a target market determination is required but has not been made,
    unless it made reasonable inquiries and believed on reasonable grounds one had
    been made. Breach is a criminal offence and a civil penalty. Binds Doshi only
    if Doshi is a regulated person under s. 1011B(f), which captures any person required
    to hold an AFS licence but who does not hold one.

    '
  tests:
    lesson:
      id: au-conduct-tmd-required-lesson
    chat:
      id: au-conduct-tmd-required-chat
- id: au-conduct-tmd-consistency
  jurisdiction: au
  axis: compliance
  category: missing_caveat
  authority:
    source: Corporations Act 2001
    clause: s. 994E(3)
    url: https://www.legislation.gov.au/C2004A01509/latest/text
    retrieved: 2026-08-04
  binds:
  - doshi
  plain_words: 'Where a target market determination exists, a regulated person must
    take reasonable steps that are reasonably likely to keep its retail product distribution
    conduct consistent with that determination. Binds Doshi only if Doshi is a regulated
    person. The institution is bound as issuer under subsection 994E(1).

    '
  tests:
    lesson:
      id: au-conduct-tmd-consistency-lesson
    chat:
      id: au-conduct-tmd-consistency-chat
- id: au-conduct-misleading-deceptive-product
  jurisdiction: au
  axis: compliance
  category: missing_caveat
  authority:
    source: Corporations Act 2001
    clause: s. 1041H(1)
    url: https://www.legislation.gov.au/C2004A01509/latest/text
    retrieved: 2026-08-04
  binds:
  - doshi
  plain_words: 'A person must not engage in conduct in relation to a financial product
    or a financial service that is misleading or deceptive, or is likely to mislead
    or deceive. Subsection 1041H(2)(b)(ii) expressly covers publishing a notice about
    a financial product. Civil liability only. There is no publisher defence. This
    is the single most likely rule to be breached in the library as it stands today.
    A wrong statutory figure on a slide about superannuation is a live claim against
    Doshi with no shelter.

    '
  tests:
    lesson:
      id: au-conduct-misleading-deceptive-product-lesson
    chat:
      id: au-conduct-misleading-deceptive-product-chat
- id: au-conduct-false-misleading-representation
  jurisdiction: au
  axis: compliance
  category: missing_caveat
  authority:
    source: Australian Securities and Investments Commission Act 2001
    clause: s. 12DB(1)
    url: https://www.legislation.gov.au/C2004A01252/latest/text
    retrieved: 2026-08-04
  binds:
  - doshi
  plain_words: 'A person must not make a false or misleading representation in connection
    with the supply or promotion of financial services. Failure is an offence under
    section 12GB. Subject to the information-provider defence in section 12DN.

    '
  tests:
    lesson:
      id: au-conduct-false-misleading-representation-lesson
    chat:
      id: au-conduct-false-misleading-representation-chat
