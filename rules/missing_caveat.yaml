- id: uk-conduct-fair-clear-not-misleading
  jurisdiction: uk
  axis: compliance
  category: missing_caveat
  authority:
    source: COBS
    clause: 4.2.1R(1)
    url: https://handbook.fca.org.uk/handbook/cobs4/cobs4s2
    retrieved: 2026-08-01
  binds:
  - institution
  plain_words: 'A firm must ensure that a communication or a financial promotion is
    fair, clear and not misleading. Binds the institution. Doshi is bound contractually
    and as the standard its content must survive the bank''s sign-off.

    '
  tests:
    lesson:
      id: uk-conduct-fair-clear-not-misleading-lesson
    chat:
      id: uk-conduct-fair-clear-not-misleading-chat
- id: uk-conduct-guaranteed-protected
  jurisdiction: uk
  axis: compliance
  category: missing_caveat
  authority:
    source: COBS
    clause: 4.2.5G
    url: https://handbook.fca.org.uk/handbook/cobs4/cobs4s2
    retrieved: 2026-08-01
  binds:
  - institution
  plain_words: 'Do not use guaranteed, protected or secure unless accurate and fully
    explained with equal prominence. Binds the institution. Doshi contractually.

    '
  tests:
    lesson:
      id: uk-conduct-guaranteed-protected-lesson
      deterministic:
        check: phrase_match
        patterns:
        - guaranteed
        - protected
        - secure
        on_match: review
    chat:
      id: uk-conduct-guaranteed-protected-chat
