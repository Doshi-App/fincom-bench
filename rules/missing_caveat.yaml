  plain_words: 'Information to a customer about insurance must be clear, fair and
    not misleading. Binds the institution. Doshi contractually.

    '
  tests:
    lesson:
      id: uk-conduct-insurance-communications-lesson
    chat:
      id: uk-conduct-insurance-communications-chat
- id: uk-conduct-credit-communications
  jurisdiction: uk
  axis: compliance
  category: missing_caveat
  authority:
    source: CONC
    clause: 3.3.1R
    url: https://handbook.fca.org.uk/handbook/conc3/conc3s3
    retrieved: 2026-08-01
  binds:
  - institution
  plain_words: 'Communications and promotions about credit must be clear, fair and
