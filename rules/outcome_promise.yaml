- id: uk-conduct-past-future-performance
  jurisdiction: uk
  axis: compliance
  category: outcome_promise
  authority:
    source: COBS
    clause: 4.6.2R / 4.6.7R
    url: https://handbook.fca.org.uk/handbook/cobs4/cobs4s6
    retrieved: 2026-08-01
  binds:
  - institution
  plain_words: 'Past performance must not be the most prominent feature, must cover
    5 years, state period and source, and carry a prominent warning. Future performance
    must rest on reasonable assumptions and warn that forecasts are unreliable.

    '
  tests:
    lesson:
      id: uk-conduct-past-future-performance-lesson
      deterministic:
        check: phrase_match
        patterns:
        - grows to
        - returns 7% a year
        - will grow to
        on_match: review
    chat:
      id: uk-conduct-past-future-performance-chat
- id: us-conduct-finra-projections
  jurisdiction: us
  axis: compliance
  category: outcome_promise
  authority:
    source: FINRA Rule 2210
    clause: d(1)(F)
    url: https://www.finra.org/rules-guidance/rulebooks/finra-rules/2210
    retrieved: 2026-08-01
  binds: []
  plain_words: 'Members may not predict or project performance, or imply that past
    performance will recur. Does not bind Doshi. The cleanest bright line available.
    Binds a broker-dealer client.

    '
  tests:
    lesson:
      id: us-conduct-finra-projections-lesson
      deterministic:
        check: phrase_match
        patterns:
        - returns 7% a year
        - will return
        - grows to
        on_match: fail
    chat:
      id: us-conduct-finra-projections-chat
- id: au-conduct-misleading-deceptive-service
  jurisdiction: au
  axis: compliance
  category: outcome_promise
  authority:
    source: Australian Securities and Investments Commission Act 2001
    clause: s. 12DA(1)
    url: https://www.legislation.gov.au/C2004A01252/latest/text
    retrieved: 2026-08-04
  binds:
  - doshi
  plain_words: 'A person must not, in trade or commerce, engage in conduct in relation
    to financial services that is misleading or deceptive, or is likely to mislead
    or deceive. Runs alongside section 1041H of the Corporations Act 2001 and catches
    services where section 1041H catches products. Subject to the information-provider
    defence in section 12DN.

    '
  tests:
    lesson:
      id: au-conduct-misleading-deceptive-service-lesson
    chat:
      id: au-conduct-misleading-deceptive-service-chat
