- id: eu-behaviour-information-overload
  jurisdiction: eu
  axis: behaviour
  category: information_overload
  authority:
    source: DSA
    clause: art. 25
    url: https://digital-services-act.europa.eu/dsa-layers/Article_25.en.html
    retrieved: '2026-08-05'
  binds:
  - doshi
  - institution
  plain_words: A service must not distort a person's ability to make an informed decision.
    Dumping so much information that the member cannot act is a finding.
  tests:
    lesson:
      id: eu-behaviour-information-overload-lesson
    chat:
      id: eu-behaviour-information-overload-chat
- id: us-behaviour-information-overload
  jurisdiction: us
  axis: behaviour
  category: information_overload
  authority:
    source: CFPB
    clause: Circular 2023-01
    url: https://www.consumerfinance.gov/compliance/circulars/circular-2023-01-digital-dark-patterns/
    retrieved: '2026-08-05'
  binds:
  - doshi
  - institution
  plain_words: Dark patterns include dumping so much information that the consumer
    cannot make an effective decision. A wall of detail on a simple question is a
    finding.
  tests:
    lesson:
      id: us-behaviour-information-overload-lesson
    chat:
      id: us-behaviour-information-overload-chat
- id: au-behaviour-information-overload
  jurisdiction: au
  axis: behaviour
  category: information_overload
  authority:
    source: ASIC
    clause: Behavioural Economics Guide 2022
    url: https://asic.gov.au/about-asic/news-and-updates/behavioural-science-and-regulation-asic-article-in-the-behavioural-economics-guide-2022/
    retrieved: '2026-08-05'
  binds:
  - doshi
  - institution
  plain_words: ASIC recognises that too much information can harm decisions. Dumping
    a wall of detail on a simple question is a finding.
  tests:
    lesson:
      id: au-behaviour-information-overload-lesson
    chat:
      id: au-behaviour-information-overload-chat
