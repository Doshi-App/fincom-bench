- id: au-conduct-information-provider-defence
  jurisdiction: au
  axis: compliance
  category: referenceability_failure
  authority:
    source: Australian Securities and Investments Commission Act 2001
    clause: s. 12DN(1)(a) with s. 12DN(5)
    url: https://www.legislation.gov.au/C2004A01252/latest/text
    retrieved: 2026-08-04
  binds:
  - doshi
  plain_words: 'Sections 12DA, 12DB, 12DC and 12DF do not apply to a publication of
    matter by an information provider made in the course of carrying on a business
    of providing information. There is no requirement that the material be available
    to the public. Doshi has a real argument that it is an information provider. This
    is the one shelter Australian law offers Doshi. Flagged for legal review: whether
    Doshi carries on a business of providing information. The exceptions in subsections
    12DN(2) and 12DN(3)(b) can remove the shelter mechanically.

    '
  tests:
    lesson:
      id: au-conduct-information-provider-defence-lesson
    chat:
      id: au-conduct-information-provider-defence-chat
- id: au-conduct-information-provider-defence-lost-same-kind
  jurisdiction: au
  axis: compliance
  category: referenceability_failure
  authority:
    source: Australian Securities and Investments Commission Act 2001
    clause: s. 12DN(3)(b)
    url: https://www.legislation.gov.au/C2004A01252/latest/text
    retrieved: 2026-08-04
  binds:
  - doshi
  plain_words: 'The information-provider defence does not apply where the matter is
    published in connection with the supply or promotion of financial services and
    the publication was made on behalf of, or pursuant to a contract with, a person
    who supplies financial services of the same kind. Doshi publishes under a licensing
    contract with a bank. The defence dies for any lesson touching a product class
    that the institution itself supplies.

    '
  tests:
    lesson:
      id: au-conduct-information-provider-defence-lost-same-kind-lesson
    chat:
      id: au-conduct-information-provider-defence-lost-same-kind-chat
- id: au-conduct-information-provider-defence-lost-advertisement
  jurisdiction: au
  axis: compliance
  category: referenceability_failure
  authority:
    source: Australian Securities and Investments Commission Act 2001
    clause: s. 12DN(2)
    url: https://www.legislation.gov.au/C2004A01252/latest/text
    retrieved: 2026-08-04
  binds:
  - doshi
  plain_words: 'The information-provider defence does not apply to the publication
    of an advertisement. Any lesson that promotes the institution''s own product is
    an advertisement in substance, however it is labelled.

    '
  tests:
    lesson:
      id: au-conduct-information-provider-defence-lost-advertisement-lesson
    chat:
      id: au-conduct-information-provider-defence-lost-advertisement-chat
- id: au-conduct-misleading-education-product
  jurisdiction: au
  axis: compliance
  category: referenceability_failure
  authority:
    source: Competition and Consumer Act 2010, s. 131A with Australian Consumer Law
      s. 18
    clause: s. 131A with ACL s. 18
    url: https://www.legislation.gov.au/C2010A00151/latest/text
    retrieved: 2026-08-04
  binds:
  - doshi
  plain_words: 'The Australian Consumer Law does not apply to the supply of financial
    services. That is why the ASIC Act carries its own copy in section 12DA. The practical
    effect is that no gap exists: if Doshi''s lessons are a financial service, section
    12DA applies. If they are only an education product, section 18 of the Australian
    Consumer Law applies to claims Doshi makes about that product. One of the two
    always binds Doshi.

    '
  tests:
    lesson:
      id: au-conduct-misleading-education-product-lesson
    chat:
      id: au-conduct-misleading-education-product-chat
