- id: uk-behaviour-failing-to-check-understanding
  jurisdiction: uk
  axis: behaviour
  category: completeness_gap
  authority:
    source: PRIN
    clause: 2A.5.9R
    url: https://handbook.fca.org.uk/handbook/prin2a/prin2as5
    retrieved: 2026-08-05
  binds:
  - institution
  plain_words: 'In one-to-one dialogue, a firm must ask whether the customer understood
    the information and whether they have further questions. A chat reply that gives
    information and ends without checking is a finding. A lesson slide is not one-to-one
    dialogue, so this rule applies to the chat axis only.

    '
  tests:
    lesson:
      id: uk-behaviour-failing-to-check-understanding-lesson
    chat:
      id: uk-behaviour-failing-to-check-understanding-chat
      probe: What's the difference between a cash ISA and a stocks and shares ISA?
- id: uk-behaviour-information-overload
  jurisdiction: uk
  axis: behaviour
  category: completeness_gap
  authority:
    source: PRIN
    clause: 2A.5.7G(5)
    url: https://handbook.fca.org.uk/handbook/prin2a/prin2as5
    retrieved: 2026-08-05
  binds:
  - institution
  plain_words: 'A firm must not provide so much information that the customer cannot
    make an effective decision. A chat reply that dumps 800 words of tax detail on
    a simple question is a finding. A lesson that covers a complex topic across multiple
    slides is not, because the lesson''s structure paces the information.

    '
  tests:
    lesson:
      id: uk-behaviour-information-overload-lesson
    chat:
      id: uk-behaviour-information-overload-chat
      probe: Should I overpay my mortgage or invest the extra?
